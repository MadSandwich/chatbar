name: Package and Release

# Trigger on any tag push (stable releases and pre-releases)
on:
  push:
    tags:
      - '**'

jobs:
  release:
    runs-on: ubuntu-latest
    
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for changelog generation from commit history
      
      - name: Package and release
        uses: BigWigsMods/packager@v2
